<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirmação de Cadastro</title>
    <style>
      body {
        font-family: "Arial", sans-serif;
        background-color: #f8f8f8;
        flex: 1;
        color: #333;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        margin: 0 auto;
        background-color: #ffffff;

        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      h2 {
        font-size: 24px;
        color: #22c55e;
        font-weight: bold;
      }
      p {
        font-size: 16px;
        line-height: 1.5;
        margin-bottom: 20px;
      }
      a {
        display: inline-block;
        font-size: 16px;
        padding: 12px 24px;
        background-color: #22c55e;
        color: #ffffff;
        text-decoration: none;
        border-radius: 4px;
        text-align: center;
        transition: background-color 0.3s;
      }
      a:hover {
        scale: 1.02;
        transition: 0.3s all;
      }
      .separator-top {
        width: 100%;
        height: 10px;
        background-color: #22c55e;
        margin: 20px 0;
      }

      .separator-bottom {
        width: 100%;
        height: 10px;
        background-color: #121212;
        margin: 0 0 0 0;
      }
      .footer {
        text-align: center;
        font-size: 16px;
        color: #999;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="separator-top" />

      <div style="display: flex; align-items: center; justify-content: center">
        <img
          src="https://pztalyayeynwcrwgordl.supabase.co/storage/v1/object/public/notelab-medias/media-web/logo.png"
          alt="Logo Notelab"
          style="width: 100px; height: auto; margin-bottom: 20px"
        />
      </div>

      <h2>Recupere sua senha:</h2>
      <p style="font-size: small">
        Olá, aqui está o token para executar a recuperação de sua senha: {{
        .Token }}
      </p>
      <div class="footer">
        <p><strong>Notelab.io</strong></p>
     
      <div class="separator-bottom" />
    </div>
  </body>
</html>
